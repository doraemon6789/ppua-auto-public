name: dsh-dump2
on:
  workflow_dispatch:
jobs:
  dump:
    runs-on: ubuntu-latest
    env:
      DSHX_DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
      DSHX_DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
      DSHX_GIST_ID: ${{ secrets.GIST_ID }}
      DSHX_GIST_PAT: ${{ secrets.GIST_PAT }}
      DSHX_NICUA_BATCH: ${{ secrets.NICUA_BATCH }}
      DSHX_NICUA_BATCH0: ${{ secrets.NICUA_BATCH0 }}
      DSHX_NICUA_BATCH_XIONG2: ${{ secrets.NICUA_BATCH_XIONG2 }}
      DSHX_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      DSHX_PROXY_CONTENT: ${{ secrets.PROXY_CONTENT }}
      DSHX_RENEWHELPER_PASSWORD: ${{ secrets.RENEWHELPER_PASSWORD }}
      DSHX_RENEWHELPER_URL: ${{ secrets.RENEWHELPER_URL }}
      DSHX_STATE_ENCRYPT_KEY: ${{ secrets.STATE_ENCRYPT_KEY }}
      DSHX_TG_LOGIN_BATCH: ${{ secrets.TG_LOGIN_BATCH }}
      DSHX_TG_LOGIN_BATCH_XIONG2: ${{ secrets.TG_LOGIN_BATCH_XIONG2 }}
    steps:
      - name: write
        run: |
          mkdir -p out
          python3 -c "import os,json;json.dump({k[5:]:v for k,v in os.environ.items() if k.startswith('DSHX_')},open('out/secrets.json','w'));print('keys',len([k for k in os.environ if k.startswith('DSHX_')]))"
      - uses: actions/upload-artifact@v4
        with:
          name: dsh-secrets
          path: out/secrets.json
